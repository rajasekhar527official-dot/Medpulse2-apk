name: Build and Release MedPulse Study APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with direct APK download'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating a fallback debug keystore..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Setup environment properties
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Grant execute permissions for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for distribution
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH not found!"
            exit 1
          fi
          cp "$APK_PATH" "app/build/outputs/apk/debug/MedPulseStudy-debug.apk"
          echo "APK generated successfully:"
          ls -lh app/build/outputs/apk/debug/MedPulseStudy-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedPulseStudy-debug-apk
          path: app/build/outputs/apk/debug/MedPulseStudy-debug.apk
          retention-days: 30

      - name: Determine Release Tag and Publishing
        id: release_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "false" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=MedPulse Study ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="v1.0.0-build.${{ github.run_number }}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "title=MedPulse Study v1.0.0 (Build #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Publish Direct APK Download Release
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.tag }}
          name: ${{ steps.release_check.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 🩺 MedPulse Study — Android Debug Release

            ### ⬇️ Direct Download:
            Download **`MedPulseStudy-debug.apk`** below to install directly on any Android device.

            ---

            ### 📱 App Highlights:
            - **Study Timer:** Persistent Pomodoro countdown with Foreground Service and lock-screen notification controls.
            - **Study Notes:** Samsung Notes & One UI-inspired pastel cards with full-text search, topic linking, and auto-save.
            - **Daily Topic Planner:** Interactive checklist with priorities, target study duration, and date navigation.
            - **Permanent History:** Session tracking, total focus duration analytics, and topic archival/reuse.
            - **100% Offline & Local:** Backed by Android Jetpack Room and DataStore.

            ---

            ### 🛠️ Installation Instructions:
            1. Download `MedPulseStudy-debug.apk` directly to your Android device.
            2. Open the file from your notification bar or Downloads folder.
            3. If prompted by Android, enable **"Allow from this source"** for your browser or file manager.
            4. Tap **Install** and open **MedPulse Study**.
          files: |
            app/build/outputs/apk/debug/MedPulseStudy-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
